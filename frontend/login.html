<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | BELAGO</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="auth-page">
    <div class="auth-shell">
      <div class="auth-card">
        <div class="auth-badge">BELAGO</div>
        <h1>Welcome back</h1>
        <p>Sign in to your student marketplace account.</p>

        <form id="loginForm" class="auth-form">
          <label>
            <span>Email</span>
            <input type="email" id="loginEmail" placeholder="you@college.edu" required />
          </label>

          <label>
            <span>Password</span>
            <input type="password" id="loginPassword" placeholder="Enter password" required />
          </label>

          <button type="submit" class="btn btn-primary wide">Login</button>
        </form>

        <div class="auth-links">
          <a href="/register">Create account</a>
          <a href="/">Back home</a>
        </div>
      </div>
    </div>

    <script src="/js/auth.js"></script>
  </body>
</html>
