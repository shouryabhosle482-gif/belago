<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explore Marketplace | BELAGO</title>
    <meta name="description" content="Browse student essentials, accessories and campus deals on BELAGO." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="dark-marketplace">
    <header class="site-header lite-header">
      <div class="topbar">
        <div class="container topbar-inner">
          <span>Belagavi campus marketplace</span>
          <span>Student verified deals</span>
        </div>
      </div>

      <div class="container header-main">
        <a href="/" class="brand">
          <span class="brand-mark">B</span>
          <span>BELAGO</span>
        </a>

        <div class="delivery-box">
          <span class="delivery-label">Deliver to</span>
          <strong>Belagavi, Karnataka</strong>
        </div>

        <form class="header-search" id="marketplaceSearchHeader" aria-label="Marketplace search">
          <div class="search-scope">All</div>
          <input id="searchInputHeader" type="text" placeholder="Search textbooks, calculators, hostel essentials..." />
          <button type="submit" class="btn btn-primary">Search</button>
        </form>

        <div class="header-tools">
          <a href="/login" class="header-link">Login</a>
          <a href="/register" class="header-link header-link--accent">Sign Up</a>
          <a href="/sell" class="btn btn-primary header-btn">Sell</a>
        </div>
      </div>

      <div class="subnav">
        <div class="container subnav-inner">
          <a href="/explore">All Categories</a>
          <a href="/explore?category=used-textbooks-notes">Used Textbooks &amp; Notes</a>
          <a href="/explore?category=pg">PG</a>
          <a href="/explore?category=part-time-jobs">Part-Time Jobs</a>
          <a href="/explore?category=events">Events</a>
          <a href="/explore?category=used-items">Used Items</a>
          <a href="/explore?category=tiffins">Tiffins</a>
        </div>
      </div>
    </header>

    <main class="marketplace-main">
      <div class="container marketplace-shell">
        <aside class="filters-panel">
          <div class="filter-header">
            <h3>Filters</h3>
            <button type="button" class="filter-clear" id="clearFilters">Clear</button>
          </div>

          <div class="filter-group">
            <label>Category</label>
            <select id="categoryFilter">
              <option value="all">All</option>
              <option value="used-textbooks-notes">Used Textbooks &amp; Notes</option>
              <option value="pg">PG</option>
              <option value="part-time-jobs">Part-Time Jobs</option>
              <option value="events">Events</option>
              <option value="used-items">Used Items</option>
              <option value="tiffins">Tiffins</option>
            </select>
          </div>

          <div class="filter-group">
            <label>Condition</label>
            <select id="conditionFilter">
              <option value="">Any</option>
              <option value="new">New</option>
              <option value="like new">Like New</option>
              <option value="good">Good</option>
              <option value="fair">Fair</option>
              <option value="used">Used</option>
            </select>
          </div>

          <div class="filter-group">
            <label>Price Range</label>
            <div class="range-row">
              <input id="minPrice" type="number" placeholder="Min" />
              <input id="maxPrice" type="number" placeholder="Max" />
            </div>
          </div>

          <div class="filter-group">
            <label>College</label>
            <input id="collegeFilter" type="text" placeholder="College or area" />
          </div>

          <div class="filter-group">
            <label>Sort By</label>
            <select id="sortFilter">
              <option value="newest">Recently Added</option>
              <option value="lowest">Lowest Price</option>
              <option value="highest">Highest Price</option>
              <option value="popular">Most Popular</option>
            </select>
          </div>
        </aside>

        <section class="results-panel">
          <div class="results-topbar">
            <div>
              <p class="eyebrow">STUDENT ESSENTIALS</p>
              <h1>Buy, sell and discover what your campus needs.</h1>
            </div>
            <div class="view-controls">
              <button class="chip active" type="button">Grid View</button>
              <button class="chip" type="button">List View</button>
            </div>
          </div>

          <div class="results-toolbar">
            <form id="marketplaceSearch" class="search-inline">
              <input type="text" id="searchInput" placeholder="Search textbooks, calculators, day-to-day essentials..." />
              <button type="submit" class="btn btn-primary">Search</button>
            </form>
            <div class="results-meta"><span id="resultCount">0</span> items found</div>
          </div>

          <div class="listing-grid" id="marketplaceGrid"></div>
        </section>
      </div>
    </main>

    <script src="/js/explore.js"></script>
  </body>
</html>
